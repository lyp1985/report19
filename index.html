<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荣华照影：魏晋南北朝美男子猜猜卡</title>
  <style>
    :root {
      --ink: #15110d;
      --ink-2: #241b15;
      --paper: #f7ecd3;
      --paper-2: #ead8b5;
      --gold: #d6ae61;
      --gold-2: #f3d995;
      --red: #9e2d24;
      --jade: #cce2d4;
      --muted: #a89069;
      --shadow: rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Microsoft YaHei", serif;
      background: radial-gradient(circle at 25% 15%, #423122 0 12%, transparent 35%),
        linear-gradient(135deg, #120f0d, #22140f 48%, #100d0b);
    }

    button {
      font: inherit;
    }

    .screen {
      display: none;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .start-screen {
      isolation: isolate;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background-image: linear-gradient(90deg, rgba(10, 8, 6, .78), rgba(10, 8, 6, .25), rgba(10, 8, 6, .72)),
        url("开场第一页界面.png");
      background-size: cover;
      background-position: center;
    }

    .start-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: url("./开场第一页界面.png") center / cover no-repeat;
      transform: scale(1.01);
    }

    .start-panel {
      width: min(760px, 92vw);
      text-align: center;
      padding: clamp(28px, 5vw, 58px);
      border: 1px solid rgba(243, 217, 149, .42);
      background: rgba(20, 15, 11, .62);
      box-shadow: 0 28px 80px var(--shadow);
      backdrop-filter: blur(3px);
    }

    .seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      margin-bottom: 18px;
      color: #fff3d4;
      border: 2px solid var(--red);
      background: rgba(158, 45, 36, .76);
      line-height: 1.1;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 76px);
      line-height: 1.08;
      font-weight: 800;
      color: var(--gold-2);
      text-shadow: 0 8px 20px rgba(0, 0, 0, .6);
    }

    .subtitle {
      margin: 18px auto 30px;
      max-width: 680px;
      color: #f3e4c1;
      font-size: clamp(17px, 2.5vw, 25px);
      line-height: 1.6;
    }

    .primary-button,
    .ghost-button,
    .answer-button {
      min-height: 48px;
      border: 0;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .primary-button {
      padding: 14px 30px;
      color: #251409;
      background: linear-gradient(180deg, #ffe5a2, #c8953c);
      box-shadow: 0 14px 28px rgba(0, 0, 0, .35), inset 0 1px rgba(255, 255, 255, .48);
      font-size: 20px;
      font-weight: 700;
    }

    .primary-button:hover,
    .ghost-button:hover,
    .answer-button:hover {
      transform: translateY(-2px);
    }

    .primary-button:disabled {
      cursor: default;
      transform: none;
      opacity: .55;
    }

    .game-screen {
      flex-direction: column;
      padding: clamp(14px, 2.4vw, 28px);
      background:
        linear-gradient(90deg, rgba(15, 12, 10, .95), rgba(29, 20, 15, .82)),
        radial-gradient(circle at 82% 20%, rgba(214, 174, 97, .18), transparent 28%),
        linear-gradient(135deg, #14110e, #2b1b12 55%, #0f0c0b);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
      width: min(1180px, 100%);
      margin: 0 auto 16px;
      color: #f4e4be;
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.15;
      color: var(--gold-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .round-state {
      justify-self: center;
      color: #ead9b6;
      font-size: 18px;
    }

    .game-tools {
      justify-self: end;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .info-pill,
    .music-button {
      padding: 8px 12px;
      color: #2b1a10;
      background: #f1d596;
      border: 1px solid rgba(255, 255, 255, .32);
      font-weight: 700;
      box-shadow: inset 0 1px rgba(255, 255, 255, .5);
    }

    .info-pill {
      white-space: nowrap;
    }

    .music-button {
      border: 1px solid rgba(255, 255, 255, .32);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .music-button:hover,
    .music-button:focus-visible {
      transform: translateY(-2px);
      background: #ffe6a5;
    }

    .music-button.muted {
      color: #f7ead0;
      background: rgba(48, 34, 25, .94);
      border-color: rgba(214, 174, 97, .42);
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(280px, 430px) minmax(320px, 1fr);
      gap: clamp(18px, 3vw, 38px);
      align-items: stretch;
      width: min(1180px, 100%);
      flex: 1;
      margin: 0 auto;
    }

    .card-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 600px;
    }

    .card-shell {
      width: min(390px, 88vw);
      aspect-ratio: 1856 / 2464;
      perspective: 1400px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.2, .75, .2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      border: 1px solid rgba(243, 217, 149, .58);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .45);
      background: var(--ink-2);
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-front {
      transform: rotateY(180deg);
      padding: clamp(18px, 4vw, 26px);
      color: #2a1a10;
      background:
        linear-gradient(180deg, rgba(255, 249, 229, .94), rgba(236, 212, 165, .96)),
        repeating-linear-gradient(90deg, rgba(78, 48, 28, .04) 0 1px, transparent 1px 12px);
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 12px;
      pointer-events: none;
      border: 1px solid rgba(158, 45, 36, .42);
    }

    .card-front-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      gap: 14px;
    }

    .card-kicker {
      color: var(--red);
      font-weight: 800;
      letter-spacing: 0;
      text-align: center;
    }

    .source-line {
      margin: -7px 0 0;
      color: #765536;
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
    }

    .quote {
      margin: 0;
      color: #2b1a10;
      font-size: clamp(18px, 2.2vw, 22px);
      line-height: 1.65;
      text-align: left;
    }

    .hint-box {
      margin-top: auto;
      padding: 12px 14px;
      color: #3c2818;
      background: rgba(255, 255, 255, .45);
      border-left: 4px solid var(--red);
      line-height: 1.45;
      font-weight: 700;
    }

    .hint-button {
      width: 100%;
      padding: 10px 14px;
      color: #6f231c;
      border: 1px dashed rgba(158, 45, 36, .58);
      background: rgba(255, 255, 255, .25);
      cursor: pointer;
      font-weight: 800;
      transition: background .18s ease, transform .18s ease, opacity .18s ease;
    }

    .hint-button:hover:not(:disabled),
    .hint-button:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .62);
    }

    .hint-button:disabled {
      cursor: default;
      opacity: .5;
    }

    .revealed-image {
      display: none;
      width: 100%;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      position: relative;
      cursor: zoom-in;
      border: 1px solid rgba(158, 45, 36, .34);
      background: #22160f;
    }

    .revealed-image::after {
      content: "点击放大";
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 5px 9px;
      color: #fff4d6;
      background: rgba(22, 14, 10, .72);
      font-size: 13px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }

    .revealed-image:hover::after,
    .revealed-image:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .revealed-image.visible {
      display: block;
      animation: revealGlow .8s ease both;
    }

    .revealed-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s ease, filter .25s ease;
    }

    .revealed-image:hover img,
    .revealed-image:focus-visible img {
      transform: scale(1.035);
      filter: brightness(1.08);
    }

    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      min-height: 600px;
      padding: clamp(20px, 3vw, 34px);
      border: 1px solid rgba(243, 217, 149, .28);
      background:
        linear-gradient(180deg, rgba(31, 22, 17, .78), rgba(15, 12, 10, .88)),
        linear-gradient(90deg, rgba(255, 255, 255, .05), transparent);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .26);
    }

    .status-line {
      min-height: 36px;
      color: var(--gold-2);
      font-size: clamp(19px, 2.2vw, 25px);
      font-weight: 800;
      line-height: 1.35;
    }

    .prompt {
      margin: 0;
      color: #f0dfba;
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.6;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 12px;
    }

    .answer-button {
      padding: 13px 14px;
      color: #f7ead0;
      border: 1px solid rgba(214, 174, 97, .35);
      background: rgba(48, 34, 25, .94);
      font-size: clamp(17px, 2vw, 21px);
      font-weight: 700;
    }

    .answer-button.correct {
      color: #1d291f;
      background: var(--jade);
      border-color: #dff3e7;
      box-shadow: 0 0 0 3px rgba(204, 226, 212, .18);
    }

    .answer-button.wrong {
      color: #ffe3d8;
      background: #79231e;
      border-color: #cf665b;
      animation: shake .32s ease;
    }

    .answer-button:disabled {
      cursor: default;
      transform: none;
      opacity: .78;
    }

    .result-card {
      display: none;
      color: #f6e7c6;
      line-height: 1.65;
    }

    .result-card.visible {
      display: block;
    }

    .result-name {
      margin: 0 0 8px;
      color: var(--gold-2);
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.1;
    }

    .result-meta {
      margin: 0;
      color: #d7c19a;
      font-size: 16px;
      line-height: 1.5;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .keyword {
      padding: 6px 10px;
      color: #321a10;
      background: var(--gold-2);
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .ghost-button {
      padding: 12px 20px;
      color: #f5dfae;
      border: 1px solid rgba(214, 174, 97, .5);
      background: rgba(255, 255, 255, .06);
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 30;
      max-width: min(620px, calc(100vw - 32px));
      padding: 12px 18px;
      color: #28180f;
      background: #f4d88f;
      box-shadow: 0 14px 38px rgba(0, 0, 0, .32);
      transform: translate(-50%, 110px);
      opacity: 0;
      transition: transform .28s ease, opacity .28s ease;
      font-weight: 800;
      text-align: center;
    }

    .toast.visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 56px);
      background: rgba(8, 6, 5, .88);
      backdrop-filter: blur(6px);
    }

    .image-lightbox[hidden] {
      display: none;
    }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      cursor: zoom-out;
    }

    .lightbox-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: min(1180px, 94vw);
      max-height: 92vh;
    }

    .lightbox-content img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border: 1px solid rgba(243, 217, 149, .72);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .62);
    }

    .lightbox-caption {
      margin: 0;
      color: #f8e7bd;
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 800;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -10px;
      right: -10px;
      z-index: 2;
      width: 44px;
      height: 44px;
      padding: 0;
      color: #2c1a10;
      border: 1px solid rgba(255, 255, 255, .62);
      background: var(--gold-2);
      cursor: pointer;
      font-size: 30px;
      line-height: 1;
    }

    .lightbox-close:hover,
    .lightbox-close:focus-visible {
      background: #fff0bf;
      transform: scale(1.05);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    .end-screen {
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(17, 13, 10, .88), rgba(17, 13, 10, .96)),
        url("开场第一页界面.png");
      background-size: cover;
      background-position: center;
    }

    .end-panel {
      width: min(740px, 92vw);
      padding: clamp(28px, 5vw, 56px);
      color: #f4e3be;
      text-align: center;
      border: 1px solid rgba(243, 217, 149, .42);
      background: rgba(23, 17, 13, .82);
      box-shadow: 0 28px 80px var(--shadow);
    }

    .final-score {
      margin: 0 0 10px;
      color: var(--gold-2);
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1;
      font-weight: 800;
    }

    .rank-text {
      margin: 0 0 24px;
      color: #f5dfae;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.3;
      font-weight: 800;
    }

    .completion-text {
      margin: 0 0 24px;
      color: #fff1ce;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.25;
      font-weight: 800;
    }

    .start-guide {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 24px;
      color: #f6e7c6;
      font-size: 15px;
    }

    .start-guide span {
      padding: 6px 10px;
      border: 1px solid rgba(243, 217, 149, .28);
      background: rgba(20, 15, 11, .36);
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-7px);
      }
      50% {
        transform: translateX(6px);
      }
      75% {
        transform: translateX(-4px);
      }
    }

    @keyframes revealGlow {
      0% {
        filter: brightness(.7);
        box-shadow: 0 0 0 rgba(214, 174, 97, 0);
      }
      60% {
        filter: brightness(1.1);
        box-shadow: 0 0 28px rgba(214, 174, 97, .48);
      }
      100% {
        filter: brightness(1);
        box-shadow: 0 0 0 rgba(214, 174, 97, 0);
      }
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .game-tools,
      .round-state {
        justify-self: center;
      }

      .brand-title {
        white-space: normal;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .card-area,
      .panel {
        min-height: auto;
      }

      .card-shell {
        width: min(330px, 86vw);
      }
    }

    @media (max-width: 560px) {
      .start-panel,
      .panel,
      .end-panel {
        border-left: 0;
        border-right: 0;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .primary-button,
      .ghost-button,
      .answer-button {
        width: 100%;
      }

      .actions {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="screen start-screen active" id="startScreen">
      <div class="start-panel">
        <div class="seal">荣华<br>照影</div>
        <h1>魏晋南北朝美男子猜猜卡</h1>
        <p class="subtitle">抽一张卡，先读史书里的风姿线索，再猜卡片下的人物是谁。</p>
        <div class="start-guide" aria-label="游戏规则摘要">
          <span>7 张人物卡</span>
          <span>每张 2 次作答</span>
          <span>最高 80 分</span>
        </div>
        <button class="primary-button" id="startButton">进入游戏</button>
      </div>
    </section>

    <section class="screen game-screen" id="gameScreen">
      <header class="topbar">
        <div class="brand">
          <p class="brand-title">荣华照影</p>
        </div>
        <div class="round-state" id="roundState">第 1 / 7 张</div>
        <div class="game-tools">
          <span class="info-pill" id="scorePill">得分 0</span>
          <span class="info-pill" id="streakPill">连击 0</span>
          <span class="info-pill" id="leftPill">剩余 7</span>
          <button class="music-button" id="musicButton" type="button" aria-pressed="true">♫ 音乐：开</button>
        </div>
      </header>

      <section class="stage">
        <div class="card-area">
          <div class="card-shell">
            <div class="card" id="card">
              <div class="card-face card-back">
                <img src="卡牌.jpg" alt="卡牌背面">
              </div>
              <div class="card-face card-front">
                <div class="card-front-content">
                  <div class="card-kicker" id="cardKicker">史书线索</div>
                  <p class="source-line" id="sourceText">抽卡后显示史料出处</p>
                  <p class="quote" id="quoteText">点击“抽一张”，让第一张风姿卡现身。</p>
                  <div class="hint-box" id="hintBox">卡牌尚未抽取</div>
                  <button class="hint-button" id="hintButton" type="button" hidden>再给一点线索</button>
                  <div class="revealed-image" id="revealedImage" role="button" tabindex="0" aria-label="人物画像，点击放大"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="status-line" id="statusLine">准备开始</div>
          <p class="prompt" id="promptText">每张卡有两次机会，答错后会出现第二条线索。</p>
          <div class="answers" id="answers"></div>
          <div class="result-card" id="resultCard">
            <h2 class="result-name" id="resultName"></h2>
            <p class="result-meta" id="resultMeta"></p>
            <div class="keywords" id="keywords"></div>
            <p id="explanation"></p>
          </div>
          <div class="actions">
            <button class="primary-button" id="drawButton">抽一张</button>
            <button class="ghost-button" id="nextButton" hidden>下一张</button>
          </div>
        </div>
      </section>
    </section>

    <section class="screen end-screen" id="endScreen">
      <div class="end-panel">
        <div class="seal">终局</div>
        <h1>风姿鉴赏完成</h1>
        <p class="final-score"><span id="finalScore">0</span> 分</p>
        <p class="rank-text" id="rankText">刚入门的风姿鉴赏家</p>
        <p class="completion-text" id="completionText">七张风姿卡已全部揭晓</p>
        <button class="primary-button" id="restartButton">再来一局</button>
      </div>
    </section>
  </main>

  <audio id="backgroundMusic" src="背景音乐.mp3" loop preload="auto"></audio>

  <div class="toast" id="toast" aria-live="polite"></div>

  <div class="image-lightbox" id="imageLightbox" hidden aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content" role="dialog" aria-modal="true" aria-labelledby="lightboxCaption">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭放大图片">×</button>
      <img id="lightboxImage" alt="">
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </div>

  <script>
    const cards = [
      {
        id: "heyan",
        name: "何晏",
        image: "何晏.png",
        source: "《世说新语·容止》",
        identity: "三国魏 · 玄学名士",
        quote: "《世说新语·容止》：何平叔美姿仪，面至白，魏明帝疑其傅粉；正夏月，与热汤饼。既噉，大汗出，以朱衣自拭，色转皎然。",
        hint1: "他以“面至白”出名。",
        hint2: "皇帝用热汤饼试探他是否擦粉。",
        keywords: ["傅粉何郎", "肤色皎然", "魏晋玄学"],
        explanation: "脸白到被怀疑擦粉，吃完热汤饼出汗后反而更白，因此有“傅粉何郎”的典故。"
      },
      {
        id: "jikang",
        name: "嵇康",
        image: "嵇康.png",
        source: "《世说新语·容止》",
        identity: "三国魏 · 竹林七贤",
        quote: "《世说新语·容止》：嵇康身长七尺八寸，风姿特秀。见者叹曰：萧萧肃肃，爽朗清举。或云：肃肃如松下风，高而徐引。",
        hint1: "他是竹林七贤之一。",
        hint2: "与《广陵散》关系最深。",
        keywords: ["竹林七贤", "松下风", "广陵散"],
        explanation: "他不是精致修饰型，而是高远、清朗、像松风一样的名士之美。"
      },
      {
        id: "panan",
        name: "潘安",
        image: "潘安.png",
        source: "《世说新语·容止》",
        identity: "西晋 · 文学家潘岳",
        quote: "《世说新语·容止》：潘岳妙有姿容，好神情。少时挟弹出洛阳道，妇人遇者，莫不连手共萦之。",
        hint1: "后世常说“貌比某人”。",
        hint2: "他的本名是潘岳。",
        keywords: ["貌比潘安", "洛阳道", "掷果盈车"],
        explanation: "潘安本名潘岳，“貌比潘安”的来源之一。他走在洛阳道上会被围观，后世还演化出“掷果盈车”的典故。"
      },
      {
        id: "weijie",
        name: "卫玠",
        image: "卫玠.png",
        source: "《晋书·卫玠传》；《世说新语·容止》",
        identity: "西晋 · 清谈名士",
        quote: "《晋书·卫玠传》：总角乘羊车入市，见者皆以为玉人，观之者倾都。《世说新语·容止》又载：人久闻其名，观者如堵墙……时人谓“看杀卫玠”。",
        hint1: "他的美和“玉人”有关。",
        hint2: "他的典故是“看杀”。",
        keywords: ["玉人", "珠玉在侧", "看杀卫玠"],
        explanation: "他被称作“玉人”，因被围观过度而病重去世，留下“看杀卫玠”的典故。"
      },
      {
        id: "lanlingwang",
        name: "兰陵王",
        image: "兰陵王.png",
        source: "《北齐书·兰陵武王传》",
        identity: "北齐 · 名将高长恭",
        quote: "《北齐书·兰陵武王传》：长恭貌柔心壮，音容兼美。",
        hint1: "他是北齐名将。",
        hint2: "他的音乐典故是《入阵曲》。",
        keywords: ["高长恭", "貌柔心壮", "兰陵王入阵曲"],
        explanation: "兰陵王高长恭外貌柔美，但作战勇猛。邙山之战中他免胄示面，后来有《兰陵王入阵曲》。"
      },
      {
        id: "duguxin",
        name: "独孤信",
        image: "独孤信.png",
        source: "《周书·独孤信传》",
        identity: "西魏 · 名将、柱国",
        quote: "《周书·独孤信传》：信美容仪，善骑射……信既少年，好自修饰，服章有殊于众，军中号为独孤郎。",
        hint1: "军中称他为“某某郎”。",
        hint2: "他曾带起“侧帽”风尚。",
        keywords: ["独孤郎", "侧帽风流", "善骑射"],
        explanation: "他兼具美貌、服饰品味和骑射能力。史书还记他打猎晚归时帽子微斜，第二天城中百姓争相模仿。"
      },
      {
        id: "murongchong",
        name: "慕容冲",
        image: "慕容冲.png",
        source: "《晋书·苻坚下》",
        identity: "十六国 · 西燕君主",
        quote: "《晋书·苻坚下》：冲年十二，亦有龙阳之姿……长安歌之曰：一雌复一雄，双飞入紫宫。又有谣曰：凤凰凤凰止阿房。",
        hint1: "他的小字是“凤凰”。",
        hint2: "他的故事与阿房城有关。",
        keywords: ["凤凰", "阿房城", "前秦与西燕"],
        explanation: "慕容冲小字凤凰，早年因姿貌受宠，后来起兵攻入关中，驻于阿房城，“凤凰止阿房”的谣言成了命运反转的线索。"
      }
    ];

    const $ = (selector) => document.querySelector(selector);
    const screens = {
      start: $("#startScreen"),
      game: $("#gameScreen"),
      end: $("#endScreen")
    };

    const startButton = $("#startButton");
    const drawButton = $("#drawButton");
    const nextButton = $("#nextButton");
    const restartButton = $("#restartButton");
    const cardEl = $("#card");
    const cardKicker = $("#cardKicker");
    const sourceText = $("#sourceText");
    const quoteText = $("#quoteText");
    const hintBox = $("#hintBox");
    const hintButton = $("#hintButton");
    const answersEl = $("#answers");
    const statusLine = $("#statusLine");
    const promptText = $("#promptText");
    const resultCard = $("#resultCard");
    const resultName = $("#resultName");
    const resultMeta = $("#resultMeta");
    const keywordsEl = $("#keywords");
    const explanationEl = $("#explanation");
    const revealedImage = $("#revealedImage");
    const scorePill = $("#scorePill");
    const streakPill = $("#streakPill");
    const leftPill = $("#leftPill");
    const roundState = $("#roundState");
    const finalScore = $("#finalScore");
    const rankText = $("#rankText");
    const toast = $("#toast");
    const imageLightbox = $("#imageLightbox");
    const lightboxBackdrop = $("#lightboxBackdrop");
    const lightboxClose = $("#lightboxClose");
    const lightboxImage = $("#lightboxImage");
    const lightboxCaption = $("#lightboxCaption");
    const musicButton = $("#musicButton");

    let deck = [];
    let current = null;
    let score = 0;
    let streak = 0;
    let firstTry = true;
    let locked = false;
    let toastTimer = 0;
    let musicOn = true;
    const backgroundMusic = $("#backgroundMusic");

    function startMusic() {
      if (!musicOn) return;

      backgroundMusic.volume = 0.42;
      backgroundMusic.play().catch(() => {
        showToast("请点击右上角音乐按钮播放背景音乐。");
      });
    }

    function stopMusic() {
      backgroundMusic.pause();
    }

    function toggleMusic() {
      musicOn = !musicOn;
      musicButton.classList.toggle("muted", !musicOn);
      musicButton.setAttribute("aria-pressed", String(musicOn));
      musicButton.textContent = musicOn ? "♫ 音乐：开" : "♫ 音乐：关";
      if (musicOn) {
        startMusic();
      } else {
        stopMusic();
      }
    }

    function showScreen(name) {
      Object.values(screens).forEach((screen) => screen.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - .5);
    }

    function startGame() {
      closeImageLightbox();
      deck = shuffle(cards);
      current = null;
      score = 0;
      streak = 0;
      firstTry = true;
      locked = false;
      showScreen("game");
      resetTable();
      updateHud();
      startMusic();
    }

    function resetTable() {
      closeImageLightbox();
      cardEl.classList.remove("flipped");
      cardKicker.textContent = "史书线索";
      sourceText.textContent = "抽卡后显示史料出处";
      quoteText.textContent = "点击“抽一张”，让第一张风姿卡现身。";
      hintBox.textContent = "卡牌尚未抽取";
      hintButton.hidden = true;
      hintButton.disabled = true;
      statusLine.textContent = "准备开始";
      promptText.textContent = "每张卡有两次机会。第一次答对得 10 分，第二次答对得 5 分。";
      answersEl.innerHTML = "";
      resultCard.classList.remove("visible");
      revealedImage.classList.remove("visible");
      revealedImage.innerHTML = "";
      drawButton.hidden = false;
      drawButton.disabled = deck.length === 0;
      nextButton.hidden = true;
    }

    function drawCard() {
      if (!deck.length) {
        finishGame();
        return;
      }

      current = deck.shift();
      firstTry = true;
      locked = false;
      resultCard.classList.remove("visible");
      revealedImage.classList.remove("visible");
      revealedImage.innerHTML = "";
      hintButton.hidden = true;
      hintButton.disabled = true;
      drawButton.hidden = true;
      nextButton.hidden = true;
      statusLine.textContent = "这张卡下面是谁？";
      promptText.textContent = "先读史书线索，再从候选人物中作答。";
      cardKicker.textContent = "史书线索";
      sourceText.textContent = current.source;
      quoteText.textContent = current.quote;
      hintBox.textContent = "第一提示：" + current.hint1;
      hintButton.hidden = false;
      hintButton.disabled = false;
      renderAnswers();
      requestAnimationFrame(() => cardEl.classList.add("flipped"));
      updateHud();
    }

    function renderAnswers() {
      answersEl.innerHTML = "";
      cards.forEach((card) => {
        const button = document.createElement("button");
        button.className = "answer-button";
        button.type = "button";
        button.textContent = card.name;
        button.addEventListener("click", () => chooseAnswer(card, button));
        answersEl.appendChild(button);
      });
    }

    function chooseAnswer(card, button) {
      if (locked || !current) return;

      if (card.id === current.id) {
        button.classList.add("correct");
        const points = firstTry ? 10 : 5;
        score += points;
        streak = firstTry ? streak + 1 : 0;
        if (streak > 0 && streak % 3 === 0) {
          score += 5;
          showToast("三连识人，额外 +5 分");
        } else {
          showToast(firstTry ? "这一眼，是魏晋风度。+10 分" : "补线索后答对，+5 分");
        }
        reveal(true);
        return;
      }

      button.classList.add("wrong");
      button.disabled = true;

      if (firstTry) {
        firstTry = false;
        streak = 0;
        hintBox.textContent = "第二提示：" + current.hint2;
        hintButton.hidden = true;
        hintButton.disabled = true;
        statusLine.textContent = "再看一句史书线索";
        promptText.textContent = "还有一次机会，第二次答对得 5 分。";
        showToast("再看一句线索。");
      } else {
        streak = 0;
        showToast("答案揭晓。");
        reveal(false);
      }

      updateHud();
    }

    function reveal(wasCorrect) {
      locked = true;
      [...answersEl.children].forEach((button) => {
        button.disabled = true;
        if (button.textContent === current.name) {
          button.classList.add("correct");
        }
      });

      statusLine.textContent = wasCorrect ? "答对了：" + current.name : "正确答案：" + current.name;
      promptText.textContent = "看图识人，记住这位人物的风姿关键词。";
      cardKicker.textContent = "人物揭晓";
      sourceText.textContent = current.source;
      quoteText.textContent = current.name + "｜" + current.keywords.join(" · ");
      resultName.textContent = current.name;
      resultMeta.textContent = current.identity;
      keywordsEl.innerHTML = current.keywords.map((word) => `<span class="keyword">${word}</span>`).join("");
      explanationEl.textContent = current.explanation;
      resultCard.classList.add("visible");
      revealedImage.innerHTML = `<img src="${current.image}" alt="${current.name}">`;
      revealedImage.classList.add("visible");
      revealedImage.setAttribute("aria-label", `点击放大查看${current.name}画像`);
      hintBox.textContent = "人物揭晓：" + current.name;
      hintButton.hidden = true;
      hintButton.disabled = true;
      nextButton.hidden = false;
      nextButton.textContent = deck.length ? "下一张" : "查看总分";
      updateHud();
    }

    function nextRound() {
      if (!deck.length) {
        finishGame();
        return;
      }
      current = null;
      resetTable();
      statusLine.textContent = "准备抽下一张";
      promptText.textContent = "剩余卡牌不会重复出现。";
      updateHud();
    }

    function finishGame() {
      finalScore.textContent = score;
      rankText.textContent = getRank(score);
      showScreen("end");
    }

    function getRank(value) {
      if (value >= 60) return "清谈席上第一眼";
      if (value >= 40) return "洛阳道资深围观者";
      if (value >= 20) return "竹林边听琴人";
      return "刚入门的风姿鉴赏家";
    }

    function updateHud() {
      const completed = cards.length - deck.length - (current ? 1 : 0);
      const round = Math.min(cards.length, Math.max(1, completed + 1));
      scorePill.textContent = "得分 " + score;
      streakPill.textContent = "连击 " + streak;
      leftPill.textContent = "剩余 " + deck.length;
      roundState.textContent = "第 " + round + " / " + cards.length + " 张";
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("visible");
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 1700);
    }

    function revealHint() {
      if (!current || locked || hintButton.disabled) return;

      hintBox.textContent = "第二提示：" + current.hint2;
      hintButton.disabled = true;
      statusLine.textContent = "线索已解锁";
      promptText.textContent = "提示不扣分，但要把握好答题节奏。";
      showToast("第二条线索已解锁。");
    }

    function openImageLightbox() {
      const image = revealedImage.querySelector("img");
      if (!image || !revealedImage.classList.contains("visible")) return;

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxCaption.textContent = current.name + " · 人物画像";
      imageLightbox.hidden = false;
      imageLightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");
      lightboxClose.focus();
    }

    function closeImageLightbox() {
      imageLightbox.hidden = true;
      imageLightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-open");
      lightboxImage.removeAttribute("src");
    }

    startButton.addEventListener("click", startGame);
    drawButton.addEventListener("click", drawCard);
    nextButton.addEventListener("click", nextRound);
    restartButton.addEventListener("click", startGame);
    hintButton.addEventListener("click", revealHint);
    revealedImage.addEventListener("click", openImageLightbox);
    revealedImage.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openImageLightbox();
      }
    });
    lightboxClose.addEventListener("click", closeImageLightbox);
    lightboxBackdrop.addEventListener("click", closeImageLightbox);
    musicButton.addEventListener("click", toggleMusic);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !imageLightbox.hidden) {
        closeImageLightbox();
      }
    });
  </script>
</body>
</html>
